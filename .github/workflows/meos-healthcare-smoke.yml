name: MEOS Healthcare Smoke

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-healthcare-memory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest httpx
      - name: Healthcare pytest chain
        env:
          PERSISTENCE_BACKEND: memory
        run: |
          pytest -q \
            contexts/hospital/tests/test_hospital_care_events_seed_flow.py \
            contexts/hospital/tests/test_hospital_care_events_flow.py \
            contexts/laboratory/tests/test_laboratory_acl.py \
            contexts/laboratory/tests/test_laboratory_p0_flow.py \
            contexts/pharmacy/tests/test_pharmacy_acl.py \
            contexts/pharmacy/tests/test_pharmacy_p0_flow.py \
            contexts/clinic/tests/test_clinic_lab_acl.py \
            --maxfail=5 \
            -k "not postgres"

  backend-healthcare-postgres-loop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marpich
          POSTGRES_PASSWORD: marpich
          POSTGRES_DB: marpich_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marpich -d marpich_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql+asyncpg://marpich:marpich@127.0.0.1:5432/marpich_platform
      JWT_SECRET: ci-healthcare-jwt-secret-not-for-prod
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: marpich
      PGPASSWORD: marpich
      PGDATABASE: marpich_platform
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + psql client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
          pip install uvicorn httpx asyncpg
      - name: Apply migrations
        working-directory: .
        run: ./scripts/run-migrations.sh
      - name: Start API
        run: |
          nohup uvicorn core.presentation.api.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/marpich-hlt-api.log 2>&1 &
          echo $! > /tmp/marpich-hlt-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start" >&2
          tail -100 /tmp/marpich-hlt-api.log >&2 || true
          exit 1
      - name: Healthcare closed-loop script
        working-directory: .
        run: |
          chmod +x ./scripts/meos-healthcare-loop.sh
          ./scripts/meos-healthcare-loop.sh
      - name: API logs on failure
        if: failure()
        run: tail -200 /tmp/marpich-hlt-api.log || true
