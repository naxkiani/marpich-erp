name: MEOS Wave 01 Smoke

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-wave01:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest httpx
      - name: Wave 01 pytest smoke
        env:
          PERSISTENCE_BACKEND: memory
        run: |
          pytest -q \
            contexts/identity/tests \
            contexts/search/tests \
            contexts/notifications/tests \
            contexts/workflow/tests/test_workflow_flow.py \
            --maxfail=8 \
            -k "not postgres and not federation"

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Typecheck shared + core
        run: |
          pnpm --filter @marpich/shared exec tsc --noEmit
          pnpm --filter @marpich/core exec tsc --noEmit || true
