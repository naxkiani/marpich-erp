context: inventory
display_name: Inventory
type: generic
description: Stock levels + sales order reservations — CAP-ENT-042 (Wave 02 Functional)
aggregates:
  - StockLevel
publishes:
  - inventory.stock.adjusted
  - inventory.stock.reserved
  - inventory.reorder.triggered
subscribes:
  - pos.sale.completed
  - sales.order.placed
  - procurement.goods.received
  - manufacturing.order.completed
  - pharmacy.dispense.completed
schema: inventory
permissions:
  - inventory.stock.read
  - inventory.stock.write
  - inventory.ai.read
  - inventory.ai.infer
ai:
  surfaces:
    - insights
    - predictions
    - recommendations
    - summaries
    - search
    - assistant
    - automation
    - document_intelligence
    - voice_commands
    - chat
    - report_explanation
    - anomaly_detection
    - forecasting
    - optimization
  prompt_templates:
    - inventory.stock.summary
    - inventory.reorder.insights
