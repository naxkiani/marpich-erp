context: payroll
display_name: Payroll
type: generic
description: Payroll lifecycle — CAP-ENT-015 (Wave 02 Functional); projects HR hires
# Peer productization: never dual-write HR employment SoR; never embed tax/GL engines
aggregates:
  - PayrollEmployee
  - PayrollRun
  - Payslip
  - SalaryStructure
  - Deduction
permissions:
  - payroll.employees.read
  - payroll.runs.read
  - payroll.runs.write
  - payroll.ai.read
  - payroll.ai.infer
publishes:
  - payroll.run.completed
  - payroll.payslip.generated
subscribes:
  - human_resources.employee.hired
  - human_resources.attendance.closed
  - tax.rule.updated
schema: payroll
ai:
  surfaces:
    - insights
    - predictions
    - recommendations
    - summaries
    - search
    - assistant
    - automation
    - document_intelligence
    - voice_commands
    - chat
    - report_explanation
    - anomaly_detection
    - forecasting
    - optimization
  prompt_templates:
    - payroll.run.summary
    - payroll.cost.insights
