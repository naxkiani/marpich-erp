context: sales
display_name: Sales
type: generic
description: Quotes and orders from CRM won opportunities — CAP-ENT-002 (Wave 02 Functional)
# Peer productization: P277 MESIARO — never fork /api/v1/sales*; never dual-write sales_* from operating fabric
aggregates:
  - Quotation
  - SalesOrder
permissions:
  - sales.quotations.read
  - sales.quotations.write
  - sales.orders.read
  - sales.orders.write
  - sales.ai.read
  - sales.ai.infer
