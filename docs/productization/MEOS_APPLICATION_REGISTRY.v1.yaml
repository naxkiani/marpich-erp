# MEOS Application Registry — v1
# Machine-readable catalog of REAL vs ASPIRATIONAL applications.
# Status legend:
#   live        — wired API + usable UI path
#   api_only    — backend present; no dedicated UI (or shell-only)
#   scaffold    — empty context package / promised only
#   docs_only   — architecture/ADR series without context package
#   missing_wire — listed in ROUTER_SPECS but package missing (skipped)
# Verification: update `verified_at` + `evidence` when a task is proven.

version: "1.0"
platform: MEOS
updated: "2026-08-11"
one_platform_laws:
