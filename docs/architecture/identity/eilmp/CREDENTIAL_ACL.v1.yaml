# P201-A3 — Credential lifecycle ACL (EILMP SoR: identity_lifecycle)
version: 1
phase: P201-A3
sor: identity_lifecycle
forbidden_sibling: eilmp

ports:
  ICredentialLifecyclePort:
    methods:
      - require_password_change
      - request_mfa_enrollment
      - revoke_passkeys
      - get_credential_status
    peers:
      password_mfa: identity
      webauthn: authentication

events:
  publishes:
    - identity_lifecycle.credential.issued
    - identity_lifecycle.credential.rotation_requested
    - identity_lifecycle.credential.mfa_enrollment_requested
    - identity_lifecycle.credential.revoked
    - identity_lifecycle.credential.failed
  subscribes:
    - identity_lifecycle.activation.requested
    - identity_lifecycle.provisioning.completed

rules:
  - Never hash passwords or store MFA secrets in identity_lifecycle
  - Orchestrate via peer APIs / ports only
  - Store user_id + credential status refs on registration onboarding map
