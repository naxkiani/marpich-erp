# EILMP lifecycle + registration events — P201-A1 / P201-A
version: "1.1"
prompt_id: P201-A1
sor: identity_lifecycle
envelope_required:
  - tenant_id
  - organization_id
  - correlation_id
  - occurred_at
  - user_id
  - security_context
  - event_id
  - event_name
  - event_version
  - source_context
  - payload

events:
  # Case / state (canonical SoR)
  - name: identity_lifecycle.case.opened
    version: 1
    maps_to: Registered
  - name: identity_lifecycle.state.changed
    version: 1
    maps_to: Verified|Approved|Provisioned|Activated|Suspended|Archived|Deleted|Restored|UnderInvestigation
  - name: identity_lifecycle.verification.completed
    version: 1
    maps_to: Verified
  - name: identity_lifecycle.consent.recorded
    version: 1
  - name: identity_lifecycle.identity.deleted
    version: 1
    maps_to: Deleted

  # Registration / onboarding (P201-A)
  - name: identity_lifecycle.registration.requested
    version: 1
    maps_to: Registered
  - name: identity_lifecycle.registration.validated
    version: 1
  - name: identity_lifecycle.registration.duplicate_detected
    version: 1
  - name: identity_lifecycle.registration.approved
    version: 1
    maps_to: Approved
  - name: identity_lifecycle.registration.rejected
    version: 1
  - name: identity_lifecycle.identity.created
    version: 1
  - name: identity_lifecycle.profile.initialized
    version: 1
  - name: identity_lifecycle.onboarding.started
    version: 1
  - name: identity_lifecycle.provisioning.requested
    version: 1
    maps_to: Provisioned
  - name: identity_lifecycle.welcome.generated
    version: 1
  - name: identity_lifecycle.activation.requested
    version: 1
    maps_to: Activated

jml_note: |
  JML actions (joiner/mover/leaver/transfer/role_change/rehire/place_under_investigation)
  emit identity_lifecycle.state.changed with action + from/to in payload.
  Dedicated Suspended/Archived event types deferred to P201-A2 if consumers require typed names.
