# P211-H — Access governance security requirements
version: "1.0"
prompt_id: P211-H
adr: "383"
requirements:
  - zero_trust_data_access
  - least_privilege
  - continuous_authorization
  - immutable_audit_logs
  - explainable_access_decisions
  - ai_agent_identity_governance
permissions:
  read: data_security.read
  write: data_security.write
  admin: data_security.admin
audit:
  via_integration_events: true
  local_audit_tables_forbidden: true
pdp:
  via_p208: true
  module_local_pdp_forbidden: true
