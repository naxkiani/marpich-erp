# P211-L — AI security requirements
version: "1.0"
prompt_id: P211-L
adr: "387"
requirements:
  - explainable_ai
  - human_oversight
  - decision_transparency
  - model_governance
  - bias_monitoring
  - auditability
  - privacy_preservation
  - controlled_autonomy
standards:
  - nist_ai_rmf
  - iso_iec_42001
  - iso_27001
