# P211-J — Protection security requirements
version: "1.0"
prompt_id: P211-J
adr: "385"
requirements:
  - data_centric_security
  - zero_trust_protection
  - key_refs_only_via_p209
  - immutable_audit_logs
  - auditable_protection_decisions
  - privacy_preserving_controls
permissions:
  read: data_security.read
  write: data_security.write
  admin: data_security.admin
audit:
  via_integration_events: true
  local_audit_tables_forbidden: true
crypto:
  kms_owner: secrets
  peer_key_refs_only: true
  module_local_kms_forbidden: true
