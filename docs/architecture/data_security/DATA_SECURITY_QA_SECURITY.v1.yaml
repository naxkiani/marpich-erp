# P211-P — QA / governance security requirements
version: "1.0"
prompt_id: P211-P
adr: "391"
requirements:
  - automated_testing
  - available_compliance_evidence
  - present_security_validation
  - clear_governance_ownership
  - trackable_risks
  - defined_production_readiness
  - continuous_assurance
  - quality_gates
standards:
  - iso_27001
  - iso_27701
  - soc_2
  - nist_csf
  - nist_privacy_framework
  - nist_ai_rmf
  - gdpr
  - pci_dss
permissions:
  read: data_security.read
  write: data_security.write
  admin: data_security.admin
  qa: data_security.qa.read
  approve: data_security.qa.approve
audit:
  via_integration_events: true
  local_audit_tables_forbidden: true
compliance:
  via_compliance_acl: true
  local_compliance_tables_forbidden: true
consent:
  ledger_owned_by: consent
