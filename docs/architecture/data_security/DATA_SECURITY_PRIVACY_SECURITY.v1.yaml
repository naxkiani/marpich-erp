# P211-I — Privacy security requirements
version: "1.0"
prompt_id: P211-I
adr: "384"
requirements:
  - privacy_by_design
  - immutable_consent_evidence_via_consent_bc
  - continuous_compliance
  - auditable_processing
  - ai_privacy_governance
  - zero_trust_personal_data_access
permissions:
  read: data_security.read
  write: data_security.write
  admin: data_security.admin
audit:
  via_integration_events: true
  local_audit_tables_forbidden: true
consent:
  ledger_owner: consent
  peer_ids_only: true
