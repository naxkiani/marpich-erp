  - id: BC-01
    name: bi_core
    aggregate_root: BIAsset
  - id: BC-02
    name: business_metrics
    aggregate_root: EnterpriseMetric
  - id: BC-03
    name: reporting_visualization
  - id: BC-04
    name: analytics_intelligence
    aggregate_root: AnalyticsModel
  - id: BC-05
    name: decision_intelligence
    aggregate_root: DecisionModel
