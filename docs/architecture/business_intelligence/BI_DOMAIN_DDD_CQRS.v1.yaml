  - MetricDefinedEvent
  - ReportGeneratedEvent
  - DashboardPublishedEvent
  - AnalyticsExecutedEvent
  - InsightGeneratedEvent
  - RecommendationGeneratedEvent
  - DecisionCompletedEvent
