apiVersion: marpich.io/v1
kind: SpaceSustainabilityLifecycle
metadata:
  prompt: P218-Q
  adr: "543"
stages:
  - environment_registration
  - orbital_monitoring
  - debris_detection
  - risk_assessment
  - impact_assessment
  - governance_review
  - cleanup_authorization
  - remediation_execution
  - compliance_validation
  - sustainability_reporting
stage_count: 10
gates:
  never_ungated_debris_cleanup_mission: true
  never_skip_planetary_protection_compliance: true
  never_skip_environmental_impact_assessment: true
  human_override_required: true
