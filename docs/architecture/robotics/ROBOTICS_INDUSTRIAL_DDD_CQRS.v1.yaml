    - robotics.industrial.quality.issue.detected.v1
    - robotics.industrial.maintenance.completed.v1
    - robotics.industrial.factory.optimisation.completed.v1
  microservices:
    - factory_management_service
    - production_planning_service
    - manufacturing_execution_service
    - industrial_robotics_service
    - industrial_automation_service
    - quality_management_service
    - maintenance_intelligence_service
    - factory_digital_twin_service
    - industrial_analytics_service
    - industrial_knowledge_graph_service
    - energy_intelligence_service
