    - id: OBJ-02
      name: Physical AI Integration
    - id: OBJ-03
      name: Industrial Intelligence Transformation
    - id: OBJ-04
      name: Human-Robot Collaboration
    - id: OBJ-05
      name: Autonomous Enterprise Evolution
  permissions:
