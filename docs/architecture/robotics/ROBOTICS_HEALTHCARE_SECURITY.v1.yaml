# ROBOTICS_HEALTHCARE_SECURITY.v1.yaml — P216-I
apiVersion: marpich.io/v1
kind: RoboticsHealthcareSecurityCatalog
metadata:
  phase: P216-I
  adr: "481"
spec:
  framework: meos_healthcare_zero_trust_framework
  domains:
    - patient_identity
    - clinician_identity
    - medical_device_identity
    - robot_identity
    - clinical_authorization
    - consent_management
    - data_encryption
    - medical_api_security
    - operational_safety
    - threat_detection
  compliance:
    - HIPAA
    - GDPR
    - ISO_13485
    - ISO_14971
    - IEC_62304
    - FHIR_Security
  hard_laws:
    - fhir_hl7_dicom_via_integration_platform_only
    - never_direct_fhir_hl7_dicom_bypass
    - medical_ai_via_p214z_acl_only
    - physical_ai_via_p214z_acl_only
    - no_module_local_llm
    - never_duplicate_hospital_clinic_core_logic
    - never_replace_p216_h_mobility
    - human_in_the_loop_required_for_clinical_autonomy
    - ungated_physical_autonomy_forbidden
    - opaque_safety_forbidden
