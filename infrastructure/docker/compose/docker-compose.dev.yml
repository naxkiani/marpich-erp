# Marpich ERP — canonical local platform stack (Postgres, Redis, Kafka)
# Usage: docker compose -f infrastructure/docker/compose/docker-compose.dev.yml up -d
# Then: ./scripts/dev-up.sh  (waits + migrates)

services:
  postgres:
    image: postgres:16-alpine
    container_name: marpich-postgres
    environment:
      POSTGRES_USER: marpich
      POSTGRES_PASSWORD: marpich
      POSTGRES_DB: marpich_platform
    ports:
      # Host 5432 is often occupied; Wave 01 defaults to 5433 (see MEOS_WAVE01_POSTGRES_RUNBOOK.md).
      - "${MARPICH_PG_HOST_PORT:-5433}:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /var/lib/postgresql/data/meos_wal_archive && cp %p /var/lib/postgresql/data/meos_wal_archive/%f
      - -c
      - archive_timeout=60
    volumes:
      - marpich_pg_data:/var/lib/postgresql/data
      - ../init-db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../migrations/002_identity_full.sql:/docker-entrypoint-initdb.d/02_identity.sql:ro
      - ../migrations/003_contexts.sql:/docker-entrypoint-initdb.d/03_contexts.sql:ro
      - ../migrations/004_notifications.sql:/docker-entrypoint-initdb.d/04_notifications.sql:ro
      - ../migrations/005_settings.sql:/docker-entrypoint-initdb.d/05_settings.sql:ro
      - ../migrations/006_organization.sql:/docker-entrypoint-initdb.d/06_organization.sql:ro
      - ../migrations/007_audit.sql:/docker-entrypoint-initdb.d/07_audit.sql:ro
      - ../migrations/008_documents.sql:/docker-entrypoint-initdb.d/08_documents.sql:ro
      - ../migrations/009_workflow.sql:/docker-entrypoint-initdb.d/09_workflow.sql:ro
      - ../migrations/010_integration.sql:/docker-entrypoint-initdb.d/10_integration.sql:ro
      - ../migrations/011_media.sql:/docker-entrypoint-initdb.d/11_media.sql:ro
      - ../migrations/012_analytics.sql:/docker-entrypoint-initdb.d/12_analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marpich -d marpich_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: marpich-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEOS_S3_ACCESS_KEY:-meosbackup}
      MINIO_ROOT_PASSWORD: ${MEOS_S3_SECRET_KEY:-meosbackup-offsite-32chars-min}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - marpich_backup_objects:/data

  minio-init:
    image: minio/mc:latest
    container_name: marpich-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MEOS_S3_ACCESS_KEY:-meosbackup}
      MINIO_ROOT_PASSWORD: ${MEOS_S3_SECRET_KEY:-meosbackup-offsite-32chars-min}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1)); [ $$i -gt 30 ] && exit 1; sleep 2
        done
        mc mb -p local/meos-backups
        mc anonymous set none local/meos-backups

  redis:
    image: redis:7-alpine
    container_name: marpich-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka-native:3.9.1
    container_name: marpich-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 10s
      retries: 10

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: marpich-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ../../observability/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.51.0
    container_name: marpich-prometheus
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/alerts:/etc/prometheus/alerts:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.4.0
    container_name: marpich-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: marpich
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  marpich_pg_data:
  marpich_backup_objects:
