{{- if .Values.secrets.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "marpich-iam.fullname" . }}-secrets
  labels:
    {{- include "marpich-iam.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreName | default "marpich-cluster-secret-store" }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ include "marpich-iam.fullname" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.vault.path | quote }}
{{- end }}
